<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview | Hero: social signal field</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#131a5e;--paper:#f3f1e8;--flash:#d7ff3d;--paper-a70:rgba(243,241,232,.7);--f-display:"Fraunces",Georgia,serif;--f-body:"Inter",system-ui,sans-serif;--f-mono:"JetBrains Mono",monospace;--gutter:clamp(1.25rem,1rem + 2vw,3.5rem)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper);font-family:var(--f-body)}
.tag{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;background:var(--flash);color:var(--ink);padding:.45em .9em;border-radius:999px;white-space:nowrap}
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#18217a 0%,var(--ink) 65%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter);pointer-events:none;z-index:5}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--flash);margin-bottom:1rem}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.6rem,1.2rem + 6vw,7rem);line-height:.98;letter-spacing:-.02em;text-shadow:0 0 40px var(--ink),0 0 80px var(--ink)}
h1 em{font-style:italic;color:var(--flash)}
.sub{margin-top:1.2rem;max-width:34ch;color:var(--paper-a70);font-size:clamp(.95rem,.9rem + .3vw,1.1rem);text-shadow:0 0 24px var(--ink)}
.counter{position:absolute;left:var(--gutter);bottom:1.4rem;z-index:6;font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-a70)}
.counter b{color:var(--flash);font-weight:500;font-variant-numeric:tabular-nums}
.hint{position:absolute;right:var(--gutter);bottom:1.4rem;z-index:6;font:500 .68rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-a70);transition:opacity .5s}
@media (max-width:700px){.hint{bottom:3.2rem;left:var(--gutter);right:auto}}
@media (max-width:760px){.tag{display:none}}
</style>
</head>
<body>
<nav class="pv-nav" style="position:fixed;top:12px;left:12px;z-index:60;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 24px);font:500 .66rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase"><a href="index.html" style="background:#f3f1e8;color:#131a5e;padding:.45em .8em;border-radius:999px;text-decoration:none">← Site</a><a href="preview-hero-signal.html" style="background:#d7ff3d;color:#131a5e;padding:.45em .8em;border-radius:999px;text-decoration:none">3</a><a href="preview-hero-fluid.html" style="background:rgba(243,241,232,.12);color:#f3f1e8;padding:.45em .8em;border-radius:999px;text-decoration:none">5</a><a href="preview-hero-particles.html" style="background:rgba(243,241,232,.12);color:#f3f1e8;padding:.45em .8em;border-radius:999px;text-decoration:none">6</a></nav>
<div class="tag" style="left:auto;right:12px;transform:none;top:12px">Preview 3 | Social signal field</div>
<section class="hero" id="hero">
  <canvas id="c"></canvas>
  <div class="copy">
    <div class="eyebrow">Us Moment | Mumbai</div>
    <h1>We make brands<br><em>unforgettable.</em></h1>
    <p class="sub">Social-first strategy, content and production for brands that want to be talked about.</p>
  </div>
  <div class="counter">Reactions sparked <b id="cnt">0</b></div>
  <div class="hint" id="hint">Move your mouse through the field</div>
</section>
<script>
(function(){
  var hero=document.getElementById("hero"),cv=document.getElementById("c"),cx=cv.getContext("2d");
  var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var LIME="#d7ff3d",PINK="#ff59c4",BLUE="#3245f5",PAPER="243,241,232";
  var W,H,dpr,marks=[],pops=[],count=0,cnt=document.getElementById("cnt");
  // marks sit on rings around a point below the headline, like ripples spreading from one post
  function build(){
    dpr=Math.min(devicePixelRatio||1,2);W=hero.clientWidth;H=hero.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    marks=[];var ox=W/2,oy=H*1.05,gap=W<700?17:22,maxR=Math.hypot(W,H)*1.05;
    for(var r=gap*2;r<maxR;r+=gap){
      var n=Math.floor(2*Math.PI*r/(gap*1.15));
      for(var i=0;i<n;i++){var a=i/n*Math.PI*2+r*.013,x=ox+Math.cos(a)*r,y=oy+Math.sin(a)*r;
        if(x<-20||x>W+20||y<-20||y>H+20)continue;
        marks.push({x:x,y:y,a:a,r:r,ex:0,ey:0,h:0,c:0,cool:0});}
    }
  }
  build();addEventListener("resize",build);
  var mx=-9999,my=-9999,last=0,pmx=0,pmy=0;
  function move(x,y){var b=hero.getBoundingClientRect();mx=x-b.left;my=y-b.top;last=performance.now();document.getElementById("hint").style.opacity=0}
  hero.addEventListener("mousemove",function(e){move(e.clientX,e.clientY)});
  hero.addEventListener("mouseleave",function(){mx=my=-9999});
  ["touchstart","touchmove"].forEach(function(ev){hero.addEventListener(ev,function(e){var t=e.touches[0];move(t.clientX,t.clientY)},{passive:true})});
  // tiny icons that pop out of the field
  function heart(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.35);cx.bezierCurveTo(x-s*1.1,y-s*.4,x-s*.45,y-s*1.05,x,y-s*.45);cx.bezierCurveTo(x+s*.45,y-s*1.05,x+s*1.1,y-s*.4,x,y+s*.35);cx.fill()}
  function play(x,y,s){cx.beginPath();cx.moveTo(x-s*.45,y-s*.6);cx.lineTo(x+s*.65,y);cx.lineTo(x-s*.45,y+s*.6);cx.closePath();cx.fill()}
  function star(x,y,s){cx.save();cx.translate(x,y);cx.lineWidth=s*.32;cx.lineCap="round";cx.strokeStyle=cx.fillStyle;for(var k=0;k<4;k++){cx.rotate(Math.PI/4);cx.beginPath();cx.moveTo(-s*.7,0);cx.lineTo(s*.7,0);cx.stroke()}cx.restore()}
  var KINDS=[[heart,PINK],[play,LIME],[star,LIME],[heart,LIME],[play,"#ffffff"]];
  function spawn(m){var k=KINDS[(Math.random()*KINDS.length)|0];pops.push({x:m.x+m.ex,y:m.y+m.ey,vy:-.5-Math.random()*.6,vx:(Math.random()-.5)*.5,t:0,f:k[0],col:k[1],s:5+Math.random()*4});count++;cnt.textContent=count.toLocaleString("en-IN")}
  var auto=0;
  function frame(ms){
    var t=ms/1000;cx.clearRect(0,0,W,H);
    var idle=performance.now()-last>2500;
    // idle: an invisible "post" glides across, so the field still reacts on its own
    var ax=mx,ay=my;if(idle||mx<0){ax=W*(.5+.38*Math.sin(t*.35));ay=H*(.55+.25*Math.sin(t*.7));}
    var speed=Math.min(40,Math.hypot(ax-pmx,ay-pmy));pmx=ax;pmy=ay;
    var R=W<700?110:170;
    for(var i=0;i<marks.length;i++){
      var m=marks[i],dx=m.x-ax,dy=m.y-ay,d=Math.hypot(dx,dy),tx=0,ty=0,th=0;
      // slow breathing ripple travelling outwards
      var wave=reduced?0:Math.sin(m.r*.035-t*1.6)*2.2;
      if(d<R){var f=1-d/R;f=f*f;tx=dx/(d||1)*f*26;ty=dy/(d||1)*f*26;th=f}
      m.ex+=(tx+Math.cos(m.a)*wave-m.ex)*.12;m.ey+=(ty+Math.sin(m.a)*wave-m.ey)*.12;m.h+=(th-m.h)*.15;
      if(m.cool>0)m.cool-=1;
      if(th>.55&&m.cool<=0&&Math.random()<(.004+speed*.0009)){spawn(m);m.cool=120;m.c=1}
      if(!reduced&&Math.random()<.00004){spawn(m);m.cool=120;m.c=1}
      m.c*=.94;
      // tick drawn along the ring tangent; it stretches, brightens and turns lime near the cursor
      var x=m.x+m.ex,y=m.y+m.ey,len=4+m.h*7,ang=m.a+Math.PI/2+m.h*.9;
      var al=.16+m.h*.75+m.c*.5;
      cx.strokeStyle=m.h>.35||m.c>.2?"rgba(215,255,61,"+Math.min(1,al)+")":"rgba("+PAPER+","+al+")";
      cx.lineWidth=1.4+m.h*1.2;cx.lineCap="round";
      cx.beginPath();cx.moveTo(x-Math.cos(ang)*len/2,y-Math.sin(ang)*len/2);cx.lineTo(x+Math.cos(ang)*len/2,y+Math.sin(ang)*len/2);cx.stroke();
    }
    for(var j=pops.length-1;j>=0;j--){
      var p=pops[j];p.t+=1/60;p.x+=p.vx;p.y+=p.vy;p.vy*=.985;
      var life=p.t/1.6;if(life>=1){pops.splice(j,1);continue}
      var sc=life<.15?life/.15:1,al2=life<.6?1:1-(life-.6)/.4;
      cx.globalAlpha=al2;cx.fillStyle=p.col;p.f(p.x,p.y,p.s*sc*(1+.15*Math.sin(p.t*10)));cx.globalAlpha=1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
