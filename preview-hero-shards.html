<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview | Hero: floating reel shards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#131a5e;--ink-soft:#1c256f;--paper:#f3f1e8;--flash:#d7ff3d;--signal:#3245f5;--gold:#ff59c4;--paper-a70:rgba(243,241,232,.7);--paper-a12:rgba(243,241,232,.12);--f-display:"Fraunces",Georgia,serif;--f-body:"Inter",system-ui,sans-serif;--f-mono:"JetBrains Mono",monospace;--gutter:clamp(1.25rem,1rem + 2vw,3.5rem)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--paper);font-family:var(--f-body)}
.tag{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;background:var(--flash);color:var(--ink);padding:.45em .9em;border-radius:999px}
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;perspective:1100px;background:radial-gradient(ellipse at 50% 55%,#1f2a8a 0%,var(--ink) 60%)}
.stage{position:absolute;inset:0;transform-style:preserve-3d}
.shard{position:absolute;left:0;top:0;width:var(--w);aspect-ratio:9/16;border-radius:14px;overflow:hidden;cursor:pointer;will-change:transform;box-shadow:0 30px 60px -25px #05082c,0 0 0 1px var(--paper-a12);transition:box-shadow .4s,filter .4s;filter:saturate(.85) brightness(.82)}
.shard img,.shard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shard video{opacity:0;transition:opacity .35s}
.shard.on{filter:none;box-shadow:0 40px 80px -25px #05082c,0 0 0 2px var(--flash)}
.shard.on video{opacity:1}
.shard .lbl{position:absolute;left:.6rem;right:.6rem;bottom:.55rem;font:600 .68rem var(--f-body);color:#fff;opacity:0;transform:translateY(6px);transition:.35s;text-shadow:0 1px 8px #000a}
.shard .lbl i{font-style:normal;color:var(--flash)}
.shard.on .lbl{opacity:1;transform:none}
.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 var(--gutter);pointer-events:none;z-index:5}
.eyebrow{font:500 .78rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--flash);margin-bottom:1rem}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2.6rem,1.2rem + 6vw,7rem);line-height:.98;letter-spacing:-.02em;text-shadow:0 10px 50px #0b0f3d}
h1 em{font-style:italic;color:var(--flash)}
.sub{margin-top:1.2rem;max-width:34ch;color:var(--paper-a70);font-size:clamp(.95rem,.9rem + .3vw,1.1rem);text-shadow:0 2px 20px #0b0f3d}
.hint{position:absolute;bottom:1.4rem;left:50%;transform:translateX(-50%);font:500 .68rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-a70);z-index:6;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.shard{transition:none}}
@media (max-width:760px){.tag{display:none}}
</style>
</head>
<body>
<nav class="pv-nav" style="position:fixed;top:12px;left:12px;z-index:60;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 24px);font:500 .66rem 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase"><a href="index.html" style="background:#f3f1e8;color:#131a5e;padding:.45em .8em;border-radius:999px;text-decoration:none">← Site</a><a href="preview-hero-shards.html" style="background:#d7ff3d;color:#131a5e;padding:.45em .8em;border-radius:999px;text-decoration:none">1</a><a href="preview-hero-pile.html" style="background:rgba(243,241,232,.12);color:#f3f1e8;padding:.45em .8em;border-radius:999px;text-decoration:none">2</a><a href="preview-hero-signal.html" style="background:rgba(243,241,232,.12);color:#f3f1e8;padding:.45em .8em;border-radius:999px;text-decoration:none">3</a><a href="preview-hero-liquid.html" style="background:rgba(243,241,232,.12);color:#f3f1e8;padding:.45em .8em;border-radius:999px;text-decoration:none">4</a><a href="preview-hero-fluid.html" style="background:rgba(243,241,232,.12);color:#f3f1e8;padding:.45em .8em;border-radius:999px;text-decoration:none">5</a></nav>
<div class="tag" style="left:auto;right:12px;transform:none;top:12px">Preview 1 | Floating reel shards</div>
<section class="hero" id="hero">
  <div class="stage" id="stage"></div>
  <div class="copy">
    <div class="eyebrow">Us Moment | Mumbai</div>
    <h1>We make brands<br><em>unforgettable.</em></h1>
    <p class="sub">Social-first strategy, content and production for brands that want to be talked about.</p>
  </div>
  <div class="hint" id="hint">Move your mouse | hover a reel to play it</div>
</section>
<script>
(function(){
  // real reels from assets/work-reels (same set as "Our work speaks louder")
  var R=[["DUm40gWCFPH","Bar Bank"],["DTQDNftCP7D","Bar Stock Exchange"],["Da0ENyZKsSA","POP UPI"],["Dc0wu0xJAsK","Comart"],["DbIu7BPINJp","Scalpe Pro"],["DdtiijpI_Vg","Fossae"],["DaiQz4ATL69","CEAT Specialty"],["Dbs0OH0NQHu","Edit"],["DYeDiv1Mson","Elra"],["DZsDUa7CMFY","Walters"]];
  // layout: x,y as fraction of the hero, depth 0 (far) .. 1 (near), rotation in deg
  var L=[[.08,.16,.35,-9],[.24,.62,.85,6],[.14,.84,.5,-4],[.83,.14,.55,8],[.92,.52,.3,-6],[.76,.76,.95,-10],[.35,.12,.2,5],[.63,.88,.25,7],[.04,.48,.7,4],[.6,.06,.6,-5]];
  var mobile=matchMedia("(max-width:700px)").matches,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(mobile){R=R.slice(0,6);L=[[.12,.12,.5,-8],[.84,.16,.7,7],[.08,.86,.6,5],[.88,.84,.45,-6],[.5,.05,.25,3],[.52,.95,.3,-4]]}
  var hero=document.getElementById("hero"),stage=document.getElementById("stage");
  var S=R.map(function(r,i){
    var l=L[i],a=document.createElement("a");a.className="shard";a.href="https://www.instagram.com/reel/"+r[0]+"/";a.target="_blank";a.rel="noopener";a.setAttribute("aria-label",r[1]+" reel on Instagram");
    var base=mobile?70:118;a.style.setProperty("--w",Math.round(base*(.7+l[2]*.75))+"px");a.style.zIndex=Math.round(l[2]*10);
    a.innerHTML='<img src="assets/work-reels/'+r[0]+'.jpg" alt=""><video muted loop playsinline preload="none" data-src="assets/work-reels/'+r[0]+'.mp4"></video><span class="lbl">'+r[1]+' <i>↗</i></span>';
    stage.appendChild(a);
    var s={el:a,v:a.querySelector("video"),fx:l[0],fy:l[1],d:l[2],rot:l[3],x:0,y:0,tx:0,ty:0,rx:0,ry:0,sc:1,on:false,ph:Math.random()*6.28};
    a.addEventListener("mouseenter",function(){s.on=true;a.classList.add("on");if(!s.v.src)s.v.src=s.v.dataset.src;var p=s.v.play();p&&p.catch(function(){})});
    a.addEventListener("mouseleave",function(){s.on=false;a.classList.remove("on");s.v.pause()});
    return s;
  });
  var W,H,mx=.5,my=.5,px=-9999,py=-9999,last=0;
  function size(){var r=hero.getBoundingClientRect();W=r.width;H=r.height}
  size();addEventListener("resize",size);
  hero.addEventListener("mousemove",function(e){var r=hero.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top;mx=px/W;my=py/H;last=performance.now();document.getElementById("hint").style.opacity=0});
  hero.addEventListener("mouseleave",function(){px=py=-9999;mx=my=.5});
  function frame(t){
    var idle=performance.now()-last>2500;
    S.forEach(function(s){
      var w=s.el.offsetWidth,h=w*16/9;
      var bx=s.fx*W-w/2,by=s.fy*H-h/2;
      // parallax: near shards move more, opposite to the cursor
      var par=(12+s.d*70),ox=-(mx-.5)*par,oy=-(my-.5)*par;
      // gentle drift (always on phones / when idle)
      var dr=(mobile||idle)&&!reduced?1:.35;ox+=Math.sin(t/1700+s.ph)*8*dr;oy+=Math.cos(t/2100+s.ph)*10*dr;
      // push away from the cursor
      var cx=bx+w/2+ox,cy=by+h/2+oy,dx=cx-px,dy=cy-py,dist=Math.hypot(dx,dy),R0=240;
      if(dist<R0&&!s.on){var f=(1-dist/R0);f=f*f*(90+s.d*60);ox+=dx/dist*f;oy+=dy/dist*f}
      s.tx=bx+ox;s.ty=by+oy;
      s.x+=(s.tx-s.x)*.09;s.y+=(s.ty-s.y)*.09;
      var tsc=s.on?1.35:1;s.sc+=(tsc-s.sc)*.12;
      var try_=(mx-.5)*26,trx=-(my-.5)*20;s.rx+=(trx-s.rx)*.08;s.ry+=(try_-s.ry)*.08;
      var rz=s.on?0:s.rot;
      s.el.style.transform="translate3d("+s.x.toFixed(1)+"px,"+s.y.toFixed(1)+"px,"+(s.on?120:s.d*60).toFixed(0)+"px) rotateX("+s.rx.toFixed(2)+"deg) rotateY("+s.ry.toFixed(2)+"deg) rotateZ("+rz+"deg) scale("+s.sc.toFixed(3)+")";
      s.el.style.zIndex=s.on?50:Math.round(s.d*10);
    });
    requestAnimationFrame(frame);
  }
  // start from the layout positions
  S.forEach(function(s){var w=s.el.offsetWidth;s.x=s.fx*W-w/2;s.y=s.fy*H-w*16/18});
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
